<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GExam Hub by George</title>
<meta name="description" content="A personal archive of exam papers and study material across the CBC Senior School curriculum.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
  :root{
    --board:#1c2b29; --board-2:#233833;
    --chalk:#f2ede2; --chalk-dim:#c8cabb;
    --geo:#d98a53; --sport:#e0b84a; --ict:#5aa9a3;
    --rule: rgba(242,237,226,0.16);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--board); color:var(--chalk);
    font-family:'IBM Plex Sans', sans-serif; min-height:100vh;
    -webkit-font-smoothing:antialiased;
    background-image:
      radial-gradient(ellipse at top left, rgba(255,255,255,0.03), transparent 60%),
      radial-gradient(ellipse at bottom right, rgba(255,255,255,0.03), transparent 60%);
  }
  h1,h2,h3{font-family:'Fraunces', serif; margin:0;}
  .mono{font-family:'IBM Plex Mono', monospace;}

  #gate{ min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px; }
  .gate-card{ width:100%; max-width:420px; text-align:center; }
  .chalk-mark{ width:64px; height:64px; margin:0 auto 28px; opacity:0.9; }
  .gate-card .eyebrow{ font-family:'IBM Plex Mono', monospace; font-size:12px; letter-spacing:0.18em; text-transform:uppercase; color:var(--chalk-dim); margin-bottom:10px; }
  .gate-card .eyebrow strong{ font-weight:700; color:var(--chalk); }
  .brand strong{ font-weight:700; color:var(--chalk); }
  .gate-card h1{ font-size:34px; font-weight:600; margin-bottom:8px; }
  .gate-card p.sub{ color:var(--chalk-dim); font-size:14.5px; margin-bottom:32px; line-height:1.5; }
  .field{ position:relative; margin-bottom:14px; }
  input[type="password"]{
    width:100%; background:var(--board-2); border:1px solid var(--rule); color:var(--chalk);
    font-family:'IBM Plex Mono', monospace; font-size:15px; padding:14px 16px; border-radius:6px;
    outline:none; transition:border-color 0.15s ease, background 0.15s ease; letter-spacing:0.03em;
  }
  input::placeholder{ color:#8f9691; }
  input:focus{ border-color:var(--sport); background:#28403a; }
  input:focus-visible{ outline:2px solid var(--sport); outline-offset:2px; }
  .enter-btn{
    width:100%; padding:14px 16px; border-radius:6px; border:none; background:var(--chalk); color:var(--board);
    font-family:'IBM Plex Sans', sans-serif; font-weight:600; font-size:15px; cursor:pointer;
    transition:transform 0.12s ease, background 0.12s ease;
  }
  .enter-btn:hover{ background:#ffffff; }
  .enter-btn:active{ transform:scale(0.98); }
  .enter-btn:focus-visible{ outline:2px solid var(--sport); outline-offset:2px; }
  #error-msg{ color:var(--geo); font-size:13px; font-family:'IBM Plex Mono', monospace; margin-top:14px; min-height:18px; }

  #dashboard{ display:none; }
  .topbar{ display:flex; align-items:center; justify-content:space-between; padding:22px 32px; border-bottom:1px solid var(--rule); }
  .brand{ display:flex; align-items:center; gap:12px; }
  .brand .dot{ width:9px; height:9px; border-radius:50%; background:var(--sport); }
  .brand span{ font-family:'IBM Plex Mono', monospace; font-size:13px; letter-spacing:0.1em; text-transform:uppercase; color:var(--chalk-dim); }
  .lock-btn{
    background:transparent; border:1px solid var(--rule); color:var(--chalk-dim);
    font-family:'IBM Plex Mono', monospace; font-size:12px; padding:8px 14px; border-radius:5px; cursor:pointer;
  }
  .lock-btn:hover{ color:var(--chalk); border-color:var(--chalk-dim); }

  .hero{ padding:48px 32px 20px; max-width:1080px; margin:0 auto; }
  .hero h1{ font-size:34px; font-weight:600; margin-bottom:8px; }
  .hero p{ color:var(--chalk-dim); font-size:14.5px; max-width:560px; line-height:1.55; }

  .group-section{ max-width:1080px; margin:0 auto; padding:24px 32px 8px; }
  .group-section[data-group="core"]{ --accent: var(--chalk-dim); }
  .group-section[data-group="stem"]{ --accent: var(--ict); }
  .group-section[data-group="social"]{ --accent: var(--geo); }
  .group-section[data-group="arts"]{ --accent: var(--sport); }
  .group-title{
    font-family:'IBM Plex Mono', monospace; font-size:11.5px; letter-spacing:0.12em; text-transform:uppercase;
    color:var(--chalk-dim); margin:0 0 14px; padding-top:16px; border-top:1px solid var(--rule);
  }
  .subjects-grid{ display:grid; grid-template-columns:repeat(3, 1fr); gap:16px; }
  @media (max-width: 860px){
    .subjects-grid{ grid-template-columns:1fr; }
    .hero{ padding:36px 20px 12px; }
    .group-section{ padding:20px 20px 4px; }
    .topbar{ padding:18px 20px; }
  }

  .folder{
    background:var(--board-2); border:1px solid var(--rule); border-top:3px solid var(--accent);
    border-radius:10px; padding:18px 18px; display:flex; flex-direction:column; gap:10px;
  }
  .folder-head{ display:flex; align-items:center; gap:10px; }
  .folder-dot{ width:9px; height:9px; border-radius:50%; background:var(--accent); flex-shrink:0; }
  .folder-title{ font-family:'Fraunces', serif; font-size:16px; font-weight:600; }
  .folder-count{ font-family:'IBM Plex Mono', monospace; font-size:10.5px; color:var(--chalk-dim); }

  .paper-list{ list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:2px; }
  .paper-list li{ border-top:1px solid var(--rule); }
  .paper-list li:first-child{ border-top:none; }
  .paper-list a{
    display:flex; align-items:center; justify-content:space-between; gap:10px; padding:10px 2px;
    color:var(--chalk); text-decoration:none; font-size:13.5px;
  }
  .paper-list a:hover .paper-name{ color:var(--accent); }
  .paper-list a:hover .go{ transform:translateX(2px); opacity:1; }
  .paper-meta{ font-family:'IBM Plex Mono', monospace; font-size:10.5px; color:var(--chalk-dim); }
  .go{ opacity:0.5; transition:transform 0.12s ease, opacity 0.12s ease; color:var(--accent); font-size:14px; }
  .empty-note{ font-family:'IBM Plex Mono', monospace; font-size:11px; color:var(--chalk-dim); padding:6px 2px; }

  .edit-note{ font-family:'IBM Plex Mono', monospace; font-size:10.5px; color:var(--chalk-dim); text-align:center; padding:40px 20px; }
  .edit-note a{ color:var(--ict); }
</style>
</head>
<body>

  <div id="gate">
    <div class="gate-card">
      <svg class="chalk-mark" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M12 16 L52 16 L52 48 L12 48 Z" stroke="#f2ede2" stroke-width="2" opacity="0.5"/>
        <path d="M20 26 L44 26" stroke="#d98a53" stroke-width="2"/>
        <path d="M20 34 L38 34" stroke="#e0b84a" stroke-width="2"/>
        <path d="M20 42 L32 42" stroke="#5aa9a3" stroke-width="2"/>
      </svg>
      <div class="eyebrow"><strong>GExam Hub by George</strong></div>
      <h1>Enter to continue</h1>
      <p class="sub">A personal archive of exam papers and study material, built to sharpen how you learn. Enter the password to get in.</p>
      <form id="gate-form" autocomplete="off">
        <div class="field"><input type="password" id="password-input" placeholder="Password" required></div>
        <button type="submit" class="enter-btn">Open GExam Hub</button>
      </form>
      <div id="error-msg" role="alert"></div>
    </div>
  </div>

  <div id="dashboard">
    <div class="topbar">
      <div class="brand"><span class="dot"></span><span><strong>GExam Hub by George</strong></span></div>
      <button class="lock-btn" id="lock-btn">Lock</button>
    </div>

    <div class="hero">
      <h1>Choose a subject</h1>
      <p>Organised by CBC Senior School pathway. Click a paper to open or download it.</p>
    </div>

    <div id="subjects-container"></div>

    <div class="edit-note">Managed from <a href="admin.html">admin.html</a></div>
  </div>

<script>
  // ====== FILL THESE IN FROM YOUR SUPABASE PROJECT (Settings → API) ======
  const SUPABASE_URL = "https://jyibobbpwpjcxyzusitz.supabase.co";
  const SUPABASE_ANON_KEY = "sb_publishable_joFeRZ9vtYvj0GdZPbh5eQ_Cekr4g6x";
  // =========================================================================

  const VISITOR_PASSWORD = "40518267@Gee";

  const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  // CBC Senior School subject list, grouped by pathway
  const GROUPS = [
    { id: 'core',   label: 'Core Subjects' },
    { id: 'stem',   label: 'STEM' },
    { id: 'social', label: 'Social Sciences' },
    { id: 'arts',   label: 'Arts & Sports Science' }
  ];

  const SUBJECTS = [
    { id: 'english', name: 'English', group: 'core' },
    { id: 'kiswahili-ksl', name: 'Kiswahili / Kenyan Sign Language', group: 'core' },
    { id: 'mathematics', name: 'Mathematics', group: 'core' },
    { id: 'csl', name: 'Community Service Learning', group: 'core' },
    { id: 'pe', name: 'Physical Education', group: 'core' },

    { id: 'biology', name: 'Biology', group: 'stem' },
    { id: 'chemistry', name: 'Chemistry', group: 'stem' },
    { id: 'physics', name: 'Physics', group: 'stem' },
    { id: 'general-science', name: 'General Science', group: 'stem' },
    { id: 'advanced-mathematics', name: 'Advanced Mathematics', group: 'stem' },
    { id: 'computer-studies', name: 'Computer Studies', group: 'stem' },
    { id: 'home-science', name: 'Home Science', group: 'stem' },
    { id: 'agriculture', name: 'Agriculture', group: 'stem' },
    { id: 'drawing-design', name: 'Drawing and Design', group: 'stem' },
    { id: 'aviation-technology', name: 'Aviation Technology', group: 'stem' },
    { id: 'building-construction', name: 'Building and Construction', group: 'stem' },
    { id: 'electrical-technology', name: 'Electrical Technology', group: 'stem' },
    { id: 'metal-technology', name: 'Metal Technology', group: 'stem' },
    { id: 'power-mechanics', name: 'Power Mechanics', group: 'stem' },
    { id: 'wood-technology', name: 'Wood Technology', group: 'stem' },
    { id: 'marine-fisheries', name: 'Marine and Fisheries Technology', group: 'stem' },

    { id: 'history-citizenship', name: 'History and Citizenship', group: 'social' },
    { id: 'geography', name: 'Geography', group: 'social' },
    { id: 'cre', name: 'Christian Religious Education', group: 'social' },
    { id: 'ire', name: 'Islamic Religious Education', group: 'social' },
    { id: 'hre', name: 'Hindu Religious Education', group: 'social' },
    { id: 'business-studies', name: 'Business Studies', group: 'social' },
    { id: 'literature-english', name: 'Literature in English', group: 'social' },
    { id: 'advanced-english', name: 'Advanced English', group: 'social' },
    { id: 'indigenous-languages', name: 'Indigenous Languages', group: 'social' },
    { id: 'fasihi-kiswahili', name: 'Fasihi ya Kiswahili', group: 'social' },
    { id: 'arabic', name: 'Arabic', group: 'social' },
    { id: 'french', name: 'French', group: 'social' },
    { id: 'german', name: 'German', group: 'social' },
    { id: 'mandarin', name: 'Mandarin', group: 'social' },

    { id: 'sports-science', name: 'Sports Science', group: 'arts' },
    { id: 'visual-arts', name: 'Visual Arts', group: 'arts' },
    { id: 'performing-arts', name: 'Performing Arts', group: 'arts' },
    { id: 'film-media', name: 'Film and Media Studies', group: 'arts' },
    { id: 'fine-art', name: 'Fine Art', group: 'arts' }
  ];

  const gate = document.getElementById('gate');
  const dashboard = document.getElementById('dashboard');
  const form = document.getElementById('gate-form');
  const input = document.getElementById('password-input');
  const errorMsg = document.getElementById('error-msg');
  const lockBtn = document.getElementById('lock-btn');
  const subjectsContainer = document.getElementById('subjects-container');

  form.addEventListener('submit', function(e){
    e.preventDefault();
    if(input.value === VISITOR_PASSWORD){
      gate.style.display = 'none';
      dashboard.style.display = 'block';
      errorMsg.textContent = '';
      renderSections();
      loadExams();
    } else {
      errorMsg.textContent = 'Incorrect password. Try again.';
      input.value = '';
      input.focus();
    }
  });

  lockBtn.addEventListener('click', function(){
    dashboard.style.display = 'none';
    gate.style.display = 'flex';
    input.value = '';
    input.focus();
  });

  function renderSections(){
    subjectsContainer.innerHTML = GROUPS.map(function(g){
      const subs = SUBJECTS.filter(function(s){ return s.group === g.id; });
      return '<section class="group-section" data-group="' + g.id + '">' +
        '<h2 class="group-title">' + g.label + '</h2>' +
        '<div class="subjects-grid">' +
        subs.map(function(s){
          return '<div class="folder">' +
            '<div class="folder-head"><span class="folder-dot"></span>' +
            '<div><div class="folder-title">' + s.name + '</div>' +
            '<div class="folder-count mono" id="count-' + s.id + '">0 papers</div></div></div>' +
            '<ul class="paper-list" id="list-' + s.id + '"></ul>' +
          '</div>';
        }).join('') +
        '</div></section>';
    }).join('');
  }

  async function loadExams(){
    const { data, error } = await supabaseClient
      .from('exams')
      .select('*')
      .order('created_at', { ascending: false });

    if(error){
      console.error(error);
      return;
    }

    const bySubject = {};
    (data || []).forEach(function(row){
      if(!bySubject[row.subject]) bySubject[row.subject] = [];
      bySubject[row.subject].push(row);
    });

    SUBJECTS.forEach(function(s){
      const listEl = document.getElementById('list-' + s.id);
      const countEl = document.getElementById('count-' + s.id);
      const rows = bySubject[s.id] || [];
      if(!listEl || !countEl) return;

      countEl.textContent = rows.length + (rows.length === 1 ? ' paper' : ' papers');

      if(rows.length === 0){
        listEl.innerHTML = '<li class="empty-note">No papers uploaded yet.</li>';
        return;
      }

      listEl.innerHTML = rows.map(function(row){
        return '<li><a href="' + row.file_url + '" target="_blank" rel="noopener">' +
          '<span><span class="paper-name">' + escapeHtml(row.title) + '</span><br>' +
          '<span class="paper-meta">' + escapeHtml(row.duration || '') + '</span></span>' +
          '<span class="go">→</span></a></li>';
      }).join('');
    });
  }

  function escapeHtml(str){
    const div = document.createElement('div');
    div.textContent = str || '';
    return div.innerHTML;
  }
</script>
</body>
</html>
