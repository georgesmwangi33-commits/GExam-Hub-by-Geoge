<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GExam Hub by George — Admin</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
  :root{
    --board:#1c2b29; --board-2:#233833;
    --chalk:#f2ede2; --chalk-dim:#c8cabb;
    --geo:#d98a53; --sport:#e0b84a; --ict:#5aa9a3;
    --rule: rgba(242,237,226,0.16);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--board); color:var(--chalk);
    font-family:'IBM Plex Sans', sans-serif; min-height:100vh; -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3{font-family:'Fraunces', serif; margin:0;}
  .mono{font-family:'IBM Plex Mono', monospace;}

  #login-screen{ min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px; }
  .card{ width:100%; max-width:400px; }
  .eyebrow{ font-family:'IBM Plex Mono', monospace; font-size:12px; letter-spacing:0.18em; text-transform:uppercase; color:var(--chalk-dim); margin-bottom:10px; }
  .card h1{ font-size:30px; font-weight:600; margin-bottom:24px; }
  .field{ margin-bottom:14px; }
  label{ display:block; font-family:'IBM Plex Mono', monospace; font-size:11px; color:var(--chalk-dim); margin-bottom:6px; letter-spacing:0.04em; }
  input, select{
    width:100%; background:var(--board-2); border:1px solid var(--rule); color:var(--chalk);
    font-family:'IBM Plex Mono', monospace; font-size:14.5px; padding:12px 14px; border-radius:6px; outline:none;
  }
  input:focus, select:focus{ border-color:var(--sport); background:#28403a; }
  input:focus-visible, select:focus-visible{ outline:2px solid var(--sport); outline-offset:2px; }
  .btn{
    padding:12px 18px; border-radius:6px; border:none; background:var(--chalk); color:var(--board);
    font-family:'IBM Plex Sans', sans-serif; font-weight:600; font-size:14.5px; cursor:pointer;
  }
  .btn:hover{ background:#ffffff; }
  .btn:active{ transform:scale(0.98); }
  .btn:focus-visible{ outline:2px solid var(--sport); outline-offset:2px; }
  .btn-block{ width:100%; }
  #login-error{ color:var(--geo); font-size:13px; font-family:'IBM Plex Mono', monospace; margin-top:12px; min-height:16px; }

  #panel{ display:none; }
  .topbar{ display:flex; align-items:center; justify-content:space-between; padding:22px 32px; border-bottom:1px solid var(--rule); }
  .brand{ display:flex; align-items:center; gap:12px; }
  .brand .dot{ width:9px; height:9px; border-radius:50%; background:var(--sport); }
  .brand span{ font-family:'IBM Plex Mono', monospace; font-size:13px; letter-spacing:0.1em; text-transform:uppercase; color:var(--chalk-dim); }
  .ghost-btn{
    background:transparent; border:1px solid var(--rule); color:var(--chalk-dim);
    font-family:'IBM Plex Mono', monospace; font-size:12px; padding:8px 14px; border-radius:5px; cursor:pointer;
  }
  .ghost-btn:hover{ color:var(--chalk); border-color:var(--chalk-dim); }

  .wrap{ max-width:760px; margin:0 auto; padding:44px 32px 80px; }
  @media (max-width: 700px){ .wrap{ padding:32px 20px 60px; } .topbar{ padding:18px 20px; } }

  .section-title{ font-size:22px; font-weight:600; margin-bottom:18px; }
  .upload-card{ background:var(--board-2); border:1px solid var(--rule); border-radius:10px; padding:24px; margin-bottom:44px; }
  .row2{ display:grid; grid-template-columns:1fr 1fr; gap:14px; }
  @media (max-width: 520px){ .row2{ grid-template-columns:1fr; } }

  #upload-status{ font-family:'IBM Plex Mono', monospace; font-size:13px; margin-top:14px; min-height:16px; }
  #upload-status.ok{ color:var(--ict); }
  #upload-status.err{ color:var(--geo); }

  .exam-row{
    display:flex; align-items:center; justify-content:space-between; gap:12px;
    padding:14px 4px; border-top:1px solid var(--rule);
  }
  .exam-row:first-child{ border-top:none; }
  .exam-info .t{ font-size:14.5px; }
  .exam-info .m{ font-family:'IBM Plex Mono', monospace; font-size:11px; color:var(--chalk-dim); margin-top:2px; }
  .subject-pill{
    font-family:'IBM Plex Mono', monospace; font-size:10px; padding:3px 8px; border-radius:20px;
    text-transform:uppercase; letter-spacing:0.04em; margin-right:8px;
  }
  .subject-pill.geo{ background:rgba(217,138,83,0.18); color:var(--geo); }
  .subject-pill.sport{ background:rgba(224,184,74,0.18); color:var(--sport); }
  .subject-pill.ict{ background:rgba(90,169,163,0.18); color:var(--ict); }
  .delete-btn{
    background:transparent; border:1px solid var(--rule); color:var(--chalk-dim);
    font-family:'IBM Plex Mono', monospace; font-size:11px; padding:6px 10px; border-radius:5px; cursor:pointer; flex-shrink:0;
  }
  .delete-btn:hover{ color:var(--geo); border-color:var(--geo); }
  .empty-note{ font-family:'IBM Plex Mono', monospace; font-size:12px; color:var(--chalk-dim); padding:8px 4px; }
</style>
</head>
<body>

  <div id="login-screen">
    <div class="card">
      <div class="eyebrow">GExam Hub by George · Admin</div>
      <h1>Sign in</h1>
      <form id="login-form" autocomplete="off">
        <div class="field"><label for="email">Email</label><input type="email" id="email" required></div>
        <div class="field"><label for="pw">Password</label><input type="password" id="pw" required></div>
        <button type="submit" class="btn btn-block">Sign in</button>
      </form>
      <div id="login-error"></div>
    </div>
  </div>

  <div id="panel">
    <div class="topbar">
      <div class="brand"><span class="dot"></span><span>GExam Hub by George · Admin</span></div>
      <button class="ghost-btn" id="signout-btn">Sign out</button>
    </div>

    <div class="wrap">
      <div class="section-title">Upload an exam</div>
      <div class="upload-card">
        <form id="upload-form">
          <div class="row2">
            <div class="field"><label for="title">Title</label><input type="text" id="title" placeholder="Paper 1 — Physical Geography" required></div>
            <div class="field"><label for="subject">Subject</label>
              <select id="subject" required>
                <optgroup label="Core Subjects">
                  <option value="english">English</option>
                  <option value="kiswahili-ksl">Kiswahili / Kenyan Sign Language</option>
                  <option value="mathematics">Mathematics</option>
                  <option value="csl">Community Service Learning</option>
                  <option value="pe">Physical Education</option>
                </optgroup>
                <optgroup label="STEM">
                  <option value="biology">Biology</option>
                  <option value="chemistry">Chemistry</option>
                  <option value="physics">Physics</option>
                  <option value="general-science">General Science</option>
                  <option value="advanced-mathematics">Advanced Mathematics</option>
                  <option value="computer-studies">Computer Studies</option>
                  <option value="home-science">Home Science</option>
                  <option value="agriculture">Agriculture</option>
                  <option value="drawing-design">Drawing and Design</option>
                  <option value="aviation-technology">Aviation Technology</option>
                  <option value="building-construction">Building and Construction</option>
                  <option value="electrical-technology">Electrical Technology</option>
                  <option value="metal-technology">Metal Technology</option>
                  <option value="power-mechanics">Power Mechanics</option>
                  <option value="wood-technology">Wood Technology</option>
                  <option value="marine-fisheries">Marine and Fisheries Technology</option>
                </optgroup>
                <optgroup label="Social Sciences">
                  <option value="history-citizenship">History and Citizenship</option>
                  <option value="geography">Geography</option>
                  <option value="cre">Christian Religious Education</option>
                  <option value="ire">Islamic Religious Education</option>
                  <option value="hre">Hindu Religious Education</option>
                  <option value="business-studies">Business Studies</option>
                  <option value="literature-english">Literature in English</option>
                  <option value="advanced-english">Advanced English</option>
                  <option value="indigenous-languages">Indigenous Languages</option>
                  <option value="fasihi-kiswahili">Fasihi ya Kiswahili</option>
                  <option value="arabic">Arabic</option>
                  <option value="french">French</option>
                  <option value="german">German</option>
                  <option value="mandarin">Mandarin</option>
                </optgroup>
                <optgroup label="Arts & Sports Science">
                  <option value="sports-science">Sports Science</option>
                  <option value="visual-arts">Visual Arts</option>
                  <option value="performing-arts">Performing Arts</option>
                  <option value="film-media">Film and Media Studies</option>
                  <option value="fine-art">Fine Art</option>
                </optgroup>
              </select>
            </div>
          </div>
          <div class="row2">
            <div class="field"><label for="duration">Duration (optional)</label><input type="text" id="duration" placeholder="1 hr 30 min"></div>
            <div class="field"><label for="file">File</label><input type="file" id="file" required></div>
          </div>
          <button type="submit" class="btn" id="upload-btn">Upload exam</button>
        </form>
        <div id="upload-status"></div>
      </div>

      <div class="section-title">Uploaded exams</div>
      <div class="upload-card" id="exam-list"><div class="empty-note">Loading…</div></div>
    </div>
  </div>

<script>
  // ====== FILL THESE IN FROM YOUR SUPABASE PROJECT (Settings → API) ======
  const SUPABASE_URL = "https://jyibobbpwpjcxyzusitz.supabase.co";
  const SUPABASE_ANON_KEY = "sb_publishable_joFeRZ9vtYvj0GdZPbh5eQ_Cekr4g6x";
  const BUCKET_NAME = "exams";
  // =========================================================================

  const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  const loginScreen = document.getElementById('login-screen');
  const panel = document.getElementById('panel');
  const loginForm = document.getElementById('login-form');
  const loginError = document.getElementById('login-error');
  const signoutBtn = document.getElementById('signout-btn');
  const uploadForm = document.getElementById('upload-form');
  const uploadStatus = document.getElementById('upload-status');
  const uploadBtn = document.getElementById('upload-btn');
  const examListEl = document.getElementById('exam-list');

  async function checkSession(){
    const { data } = await supabaseClient.auth.getSession();
    if(data.session){
      showPanel();
    } else {
      loginScreen.style.display = 'flex';
      panel.style.display = 'none';
    }
  }

  function showPanel(){
    loginScreen.style.display = 'none';
    panel.style.display = 'block';
    loadExamList();
  }

  loginForm.addEventListener('submit', async function(e){
    e.preventDefault();
    loginError.textContent = '';
    const email = document.getElementById('email').value;
    const pw = document.getElementById('pw').value;
    const { error } = await supabaseClient.auth.signInWithPassword({ email: email, password: pw });
    if(error){
      loginError.textContent = error.message;
    } else {
      showPanel();
    }
  });

  signoutBtn.addEventListener('click', async function(){
    await supabaseClient.auth.signOut();
    loginScreen.style.display = 'flex';
    panel.style.display = 'none';
  });

  uploadForm.addEventListener('submit', async function(e){
    e.preventDefault();
    uploadStatus.textContent = 'Uploading…';
    uploadStatus.className = '';
    uploadBtn.disabled = true;

    try{
      const title = document.getElementById('title').value.trim();
      const subject = document.getElementById('subject').value;
      const duration = document.getElementById('duration').value.trim();
      const fileInput = document.getElementById('file');
      const file = fileInput.files[0];

      const safeName = Date.now() + '-' + file.name.replace(/[^a-zA-Z0-9._-]/g, '_');
      const path = subject + '/' + safeName;

      const { error: uploadError } = await supabaseClient
        .storage.from(BUCKET_NAME)
        .upload(path, file, { cacheControl: '3600', upsert: false });
      if(uploadError) throw uploadError;

      const { data: publicUrlData } = supabaseClient.storage.from(BUCKET_NAME).getPublicUrl(path);

      const { error: insertError } = await supabaseClient
        .from('exams')
        .insert({
          title: title,
          subject: subject,
          duration: duration,
          file_path: path,
          file_url: publicUrlData.publicUrl
        });
      if(insertError) throw insertError;

      uploadStatus.textContent = 'Uploaded "' + title + '".';
      uploadStatus.className = 'ok';
      uploadForm.reset();
      loadExamList();
    } catch(err){
      uploadStatus.textContent = 'Error: ' + err.message;
      uploadStatus.className = 'err';
    } finally {
      uploadBtn.disabled = false;
    }
  });

  async function loadExamList(){
    const { data, error } = await supabaseClient
      .from('exams')
      .select('*')
      .order('created_at', { ascending: false });

    if(error){
      examListEl.innerHTML = '<div class="empty-note">Could not load exams: ' + error.message + '</div>';
      return;
    }
    if(!data || data.length === 0){
      examListEl.innerHTML = '<div class="empty-note">No exams uploaded yet.</div>';
      return;
    }

    examListEl.innerHTML = data.map(function(row){
      return '<div class="exam-row" data-id="' + row.id + '" data-path="' + escapeAttr(row.file_path) + '">' +
        '<div class="exam-info">' +
          '<span class="subject-pill ' + row.subject + '">' + row.subject + '</span>' +
          '<span class="t">' + escapeHtml(row.title) + '</span>' +
          '<div class="m">' + escapeHtml(row.duration || '') + '</div>' +
        '</div>' +
        '<button class="delete-btn" onclick="deleteExam(\'' + row.id + '\', \'' + escapeAttr(row.file_path) + '\')">Delete</button>' +
      '</div>';
    }).join('');
  }

  window.deleteExam = async function(id, path){
    if(!confirm('Delete this exam? This removes the file too.')) return;
    await supabaseClient.storage.from(BUCKET_NAME).remove([path]);
    await supabaseClient.from('exams').delete().eq('id', id);
    loadExamList();
  };

  function escapeHtml(str){
    const div = document.createElement('div');
    div.textContent = str || '';
    return div.innerHTML;
  }
  function escapeAttr(str){ return (str || '').replace(/'/g, "\\'"); }

  checkSession();
</script>
</body>
            </html>
